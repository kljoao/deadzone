# =========================================================
#  Deadzone - Barulho (atrai zumbis)
# =========================================================

enabled: true

# Acima deste nível de barulho acumulado, zumbis por perto são atraídos.
threshold: 25

# Quanto o barulho diminui por segundo (silêncio).
decay-per-second: 2

# Barulho por segundo CORRENDO (sem agachar).
sprint-per-second: 3

# Barulho ao PULAR (pontual).
jump: 2

# Raio para atrair zumbis quando o barulho acumulado estoura.
# (Tiros usam o raio/intensidade próprios da arma, bem maiores — são bem mais altos.)
attract-radius: 24
