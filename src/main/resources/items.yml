# =========================================================
#  Deadzone - Itens Médicos & Químicos
#  Fabricados na Bancada Médica (/bancada). Itens com 'requires-skill'
#  só aparecem na bancada para quem tem a skill (Médico, Fase 3).
# =========================================================

items:

  bandagem:
    material: PAPER
    name: "<white>Bandagem"
    lore:
      - "<gray>Estanca sangramentos."
      - "<dark_gray>Não cura vida."
    model-data: 1001
    tier: T1
    use:
      cooldown-seconds: 8
      cast-seconds: 5          # tempo de canalização (segurar/imóvel) para aplicar
    recipe:
      ingredients:
        STRING: 8

  alcool_desinfetante:
    material: GLASS_BOTTLE
    name: "<aqua>Álcool Desinfetante"
    lore:
      - "<gray>Esteriliza ferimentos."
      - "<gray>Combine com uma bandagem."
    model-data: 1008
    tier: T1
    recipe:
      ingredients:
        GLASS_BOTTLE: 1
        SUGAR: 2

  bandagem_esterilizada:
    material: PAPER
    name: "<white>Bandagem Esterilizada"
    lore:
      - "<gray>Estanca sangramentos sem risco"
      - "<gray>de infeccionar a ferida."
    model-data: 1009
    tier: T1
    use:
      cooldown-seconds: 8
      cast-seconds: 5
    recipe:
      ingredients:
        bandagem: 1
        alcool_desinfetante: 1

  analgesico:
    material: SUGAR
    name: "<white>Analgésico"
    lore:
      - "<gray>Remove debuffs leves (náusea, fraqueza, lentidão)."
    model-data: 1002
    tier: T1
    use:
      cooldown-seconds: 20
      sanity: 30
    recipe:
      ingredients:
        SUGAR: 1
        GLOWSTONE_DUST: 1

  antidoto:
    material: GLASS_BOTTLE
    name: "<green>Antídoto"
    lore:
      - "<gray>Suprime os sintomas e abaixa 10% da infecção."
      - "<dark_red>NÃO cura por completo."
    model-data: 1003
    tier: T2
    use:
      cooldown-seconds: 30
      suppress-seconds: 90
      reduce-infection: 10
    recipe:
      ingredients:
        SPIDER_EYE: 1
        SUGAR: 1
        GLASS_BOTTLE: 1

  seringa_adrenalina:
    material: BLAZE_ROD
    name: "<gold>Seringa de Adrenalina"
    lore:
      - "<gray>Restaura fôlego e dá um impulso imediato."
      - "<dark_gray>Fabricação exclusiva: Médico"
    model-data: 1004
    tier: T2
    use:
      cooldown-seconds: 60
      speed-seconds: 12
      speed-amplifier: 1
      sanity: 25
    recipe:
      requires-skill: med_farmacologia_avancada
      ingredients:
        IRON_INGOT: 1
        REDSTONE: 2
        GHAST_TEAR: 1

  kit_primeiros_socorros:
    material: SHEARS
    name: "<red>Kit de Primeiros Socorros"
    lore:
      - "<gray>Cura ferimentos graves."
      - "<gray>Revive jogadores derrubados."
      - "<dark_gray>Fabricação exclusiva: Médico"
    model-data: 1005
    tier: T2
    use:
      cooldown-seconds: 30
      heal: 12
    recipe:
      requires-skill: med_farmacologia_avancada
      ingredients:
        bandagem: 2
        LEATHER: 1
        REDSTONE: 1

  tala:
    material: BONE
    name: "<white>Tala"
    lore:
      - "<gray>Imobiliza e acelera a recuperação"
      - "<gray>de uma perna quebrada."
    model-data: 1007
    tier: T1
    recipe:
      ingredients:
        STICK: 2
        STRING: 1

  gas_mask:
    material: CARVED_PUMPKIN
    name: "<gray>Máscara de Gás"
    lore:
      - "<gray>Equipe no capacete para se proteger"
      - "<gray>em zonas tóxicas/irradiadas."
    model-data: 4001
    tier: T2

  desfibrilador:
    material: FLINT_AND_STEEL
    name: "<aqua>Desfibrilador"
    lore:
      - "<gray>Revive um jogador derrubado com 50% de vida."
      - "<dark_gray>Fabricação exclusiva: Médico"
    model-data: 1006
    tier: T3
    use:
      cooldown-seconds: 5
    recipe:
      requires-skill: med_farmacologia_avancada
      ingredients:
        COPPER_INGOT: 2
        REDSTONE_BLOCK: 1
        QUARTZ: 1

  # ===== Armeiro -> Anexos (attachments) =====
  silenciador:
    material: IRON_INGOT
    name: "<gray>Silenciador"
    lore:
      - "<dark_gray>Anexo de arma de fogo."
      - "<gray>Reduz o barulho do disparo."
      - "<dark_gray>Aplique numa arma compatível."
    model-data: 5001
    category: armeiro_attachments
    tier: T2
    recipe:
      requires-skill: armeiro
      ingredients:
        IRON_INGOT: 5
        COPPER_INGOT: 2
        AMETHYST_SHARD: 2

  mira_8x:
    material: SPYGLASS
    name: "<gray>Mira 8x"
    lore:
      - "<dark_gray>Anexo de arma de fogo."
      - "<gray>Luneta de longo alcance (mais zoom)."
      - "<dark_gray>Aplique num fuzil compatível."
    model-data: 5002
    category: armeiro_attachments
    tier: T2
    recipe:
      requires-skill: armeiro
      ingredients:
        AMETHYST_SHARD: 2
        COPPER_INGOT: 2
        GLASS: 1

  # ===== Armeiro -> Armas =====
  # Os itens entregues sao as ARMAS (registradas pelo firearms.yml, que sobrescreve estes ids
  # no registro); estas entradas existem so para a receita e o icone na aba Armas da bancada.
  ump:
    material: CARROT_ON_A_STICK
    name: "<gray>UMP-45"
    lore:
      - "<dark_gray>Submetralhadora .45 ACP."
    model-data: 3002
    category: armeiro_armas
    tier: T2
    recipe:
      requires-skill: armeiro
      ingredients:
        IRON_INGOT: 8
        COPPER_INGOT: 4
        REDSTONE: 4
        AMETHYST_SHARD: 1

  kar98k:
    material: CARROT_ON_A_STICK
    name: "<gray>Kar98k"
    lore:
      - "<dark_gray>Fuzil de ferrolho 7.92."
    model-data: 3005
    category: armeiro_armas
    tier: T3
    recipe:
      requires-skill: armeiro
      ingredients:
        IRON_INGOT: 12
        COPPER_INGOT: 4
        AMETHYST_SHARD: 2

  # Aplicar silenciador: UMP + Silenciador -> UMP Silenciada.
  ump_suppressed:
    material: CARROT_ON_A_STICK
    name: "<gray>UMP-45 (Silenciada)"
    lore:
      - "<dark_gray>Aplica o silenciador na UMP-45."
    model-data: 3003
    category: armeiro_armas
    tier: T2
    recipe:
      ingredients:
        ump: 1
        silenciador: 1

  # Aplicar mira 8x: Kar98k + Mira 8x -> Kar98k (Luneta).
  kar98k_scope:
    material: CARROT_ON_A_STICK
    name: "<gray>Kar98k (Luneta)"
    lore:
      - "<dark_gray>Aplica a mira 8x no Kar98k."
    model-data: 3006
    category: armeiro_armas
    tier: T3
    recipe:
      ingredients:
        kar98k: 1
        mira_8x: 1

  # Aplicar silenciador na luneta: Kar98k (Luneta) + Silenciador -> Kar98k (Luneta + Silenciador).
  kar98k_scope_sup:
    material: CARROT_ON_A_STICK
    name: "<gray>Kar98k (Luneta + Silenciador)"
    lore:
      - "<dark_gray>Aplica o silenciador no Kar98k com luneta."
    model-data: 3007
    category: armeiro_armas
    tier: T3
    recipe:
      ingredients:
        kar98k_scope: 1
        silenciador: 1

  # ===== Loot / Economia =====
  # Sucata: cai nos baús de loot; o jogador vende no mercador por scraps (mecânica futura).
  scrap:
    material: IRON_NUGGET
    name: "<gray>Sucata"
    lore:
      - "<dark_gray>Ferro-velho, peças e restos."
      - "<gray>Venda no mercador por scraps."
    model-data: 6001
    tier: T1
