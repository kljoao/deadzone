# =========================================================
#  Deadzone - configuração global
# =========================================================

# Logs de depuração extras (verboso). Mantenha false em produção.
debug: false

database:
  # Tipo do banco: "sqlite" (servidor unico/dev) ou "postgresql" (producao/escala/rede).
  type: sqlite
  # Tamanho do pool de conexoes. SQLite: 4 basta. PostgreSQL: 10-20 conforme a carga.
  pool-size: 4
  # Conexao PostgreSQL (so usada quando type: postgresql).
  # Crie o banco e o usuario no Postgres antes (ex.: CREATE DATABASE deadzone; CREATE USER ...).
  # O plugin cria as TABELAS sozinho.
  postgresql:
    host: localhost
    port: 5432
    database: deadzone
    username: deadzone
    password: ""
    # ssl: true em provedores na nuvem (Neon, Supabase, RDS, etc.).
    ssl: false

profiles:
  # Intervalo (minutos) do autosave de perfis "sujos" (alterados).
  autosave-minutes: 5

# Reset total na morte (permadeath de progressão).
wipe-on-death:
  enabled: true
  # Reseta o XP gastável a 0 na morte.
  reset-xp: true
  # Mantém o total histórico de XP ganho (estatística cosmética).
  keep-total-xp-stat: true

# Envio automático do resource pack (modelos/texturas customizadas) no login.
# Hospede o dist/deadzone-resourcepack.zip numa URL pública e preencha url + sha1.
resource-pack:
  enabled: false
  url: ""
  sha1: ""
  force: false
  prompt: "<red>Instale o pacote do Deadzone para ver os itens 3D."
