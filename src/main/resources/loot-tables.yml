# =========================================================
#  Deadzone - Tabelas de Loot do Mundo
#  Modelo de CHANCE INDEPENDENTE: cada entrada tem sua própria % de cair.
#  As chances NÃO precisam somar 100 — um baú pode ter 0..N itens.
#  Tipos de caixa são livres: crie quantos quiser (comum, rara, militar...).
#    item:     id de item custom (ItemRegistry) — ver items.yml / firearms.yml
#    material: nome de Material vanilla (ex.: STRING, SPIDER_EYE)
#    chance:   % independente de cair (0..100, aceita decimal: 0.5)
#    min/max:  quantidade quando cai (uniforme)
#  Marque um baú no mundo com: /loot mark <tipo>
# =========================================================

# Tempo (segundos) até o conteúdo COMPARTILHADO do baú recarregar (re-rola fresh).
cooldown-seconds: 1800

types:
